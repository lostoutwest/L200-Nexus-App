<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#73521C"/>
      <stop offset="25%" style="stop-color:#D4AF5A"/>
      <stop offset="50%" style="stop-color:#FFE7A3"/>
      <stop offset="70%" style="stop-color:#D4AF5A"/>
      <stop offset="100%" style="stop-color:#4E3510"/>
    </linearGradient>
    <linearGradient id="goldShimmer2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4E3510"/>
      <stop offset="30%" style="stop-color:#D4AF5A"/>
      <stop offset="55%" style="stop-color:#FFE7A3"/>
      <stop offset="80%" style="stop-color:#D4AF5A"/>
      <stop offset="100%" style="stop-color:#73521C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#171713"/>
      <stop offset="100%" style="stop-color:#070706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#D4AF5A" stroke-width="6"/>

  <!-- Outer gold ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldShimmer)" stroke-width="3" opacity="0.6"/>

  <!-- Three diamonds (Mitsubishi-inspired) -->
  <!-- Center diamond -->
  <polygon points="256,100 340,210 256,320 172,210"
           fill="url(#goldShimmer)" filter="url(#glow)" stroke="#FFE7A3" stroke-width="1.5" opacity="0.95"/>
  <!-- Left diamond -->
  <polygon points="256,320 340,430 256,430 172,320"
           fill="url(#goldShimmer2)" stroke="#D4AF5A" stroke-width="1.5" opacity="0.9"
           transform="translate(-70,-5)"/>
  <!-- Right diamond -->
  <polygon points="256,320 340,430 256,430 172,320"
           fill="url(#goldShimmer)" stroke="#D4AF5A" stroke-width="1.5" opacity="0.9"
           transform="translate(70,-5)"/>

  <!-- Subtle inner highlight on center diamond -->
  <polygon points="256,130 322,210 256,290 190,210"
           fill="none" stroke="#FFE7A3" stroke-width="0.5" opacity="0.3"/>

  <!-- "L200 SPORT" text at bottom -->
  <text x="256" y="440" font-family="Arial, Helvetica, sans-serif" font-size="28"
        font-weight="900" letter-spacing="6" fill="url(#goldShimmer)"
        text-anchor="middle" filter="url(#glow)">L200 SPORT</text>
</svg>
</create_svg_or_dot_ico>